<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loading</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

  <!-- Constellation particle canvas -->
  <canvas id="particles"></canvas>

  <!-- Background slideshow -->
  <div id="bg-wrap" class="bg-wrap"></div>

  <!-- Gradient vignette + scanlines -->
  <div class="bg-vignette"></div>
  <div class="scanlines"></div>

  <!-- ══════════════════════════════════════════
       HEADER
  ══════════════════════════════════════════ -->
  <header class="top-bar">

    <!-- Left: badge + online count -->
    <div class="top-left">
      <div class="server-badge" id="server-badge">
        <!-- sparkle icon -->
        <svg class="badge-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1.5L9.09 5.91L13.5 7L9.09 8.09L8 12.5L6.91 8.09L2.5 7L6.91 5.91L8 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        <span id="badge-season">SEASON 1</span>
        <span class="badge-sep">·</span>
        <span id="badge-version">v2.0</span>
      </div>

      <div class="online-wrap">
        <span class="live-dot"></span>
        <span class="online-num">
          <span id="online-count">0</span><span class="online-sep">/</span><span id="max-players">200</span>
        </span>
        <span class="online-lbl">ONLINE</span>
      </div>
    </div>

    <!-- Center: logo -->
    <div class="top-center">
      <img src="images/logo.png" alt="Logo" class="logo" />
    </div>

    <!-- Right: socials + rules -->
    <div class="top-right">
      <div class="social-links" id="social-links">
        <!-- Populated by script.js -->
      </div>
      <button class="rules-btn" onclick="toggleRules()">
        <!-- file-text icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Rules</span>
      </button>
    </div>

  </header>

  <!-- ══════════════════════════════════════════
       CENTER STAGE — Tagline + Tips
  ══════════════════════════════════════════ -->
  <main class="center-stage">
    <p class="tagline" id="tagline"></p>
    <div class="tips-pill">
      <!-- info circle icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span class="tip-text" id="tip-text">Loading server data…</span>
    </div>
  </main>

  <!-- ══════════════════════════════════════════
       BOTTOM BAR — Music + Loading progress
  ══════════════════════════════════════════ -->
  <footer class="bottom-bar">

    <!-- ── Music Player ── -->
    <div class="player-wrap">

      <!-- ROW 1: identity · controls · tracklist toggle -->
      <div class="player-row-top">

        <div class="player-identity">
          <div class="player-eq" id="eq">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="player-meta">
            <div class="player-name" id="track-name">No track loaded</div>
            <div class="player-artist" id="track-artist">—</div>
          </div>
        </div>

        <div class="player-controls">
          <button class="p-btn" id="prev-btn" title="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="p-btn p-play" id="play-pause-btn" title="Play / Pause">
            <svg id="play-icon"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="p-btn" id="next-btn" title="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14 5.14 3.64L8 17.14V9.86zM16 6h2v12h-2z"/></svg>
          </button>
        </div>

        <button class="p-btn tracklist-toggle" id="tracklist-toggle" title="Track list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8"  y1="6"  x2="21" y2="6"/>
            <line x1="8"  y1="12" x2="21" y2="12"/>
            <line x1="8"  y1="18" x2="21" y2="18"/>
            <line x1="3"  y1="6"  x2="3.01" y2="6"/>
            <line x1="3"  y1="12" x2="3.01" y2="12"/>
            <line x1="3"  y1="18" x2="3.01" y2="18"/>
          </svg>
        </button>

      </div><!-- /player-row-top -->

      <!-- ROW 2: seek bar · volume -->
      <div class="player-row-bottom">

        <div class="player-seek" id="seek-bar">
          <div class="player-seek-fill" id="progress-fill"></div>
        </div>

        <div class="player-times">
          <span id="current-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>

        <div class="player-vol">
          <svg id="vol-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
          <input type="range" id="volume-slider" min="0" max="100" value="60" class="vol-slider" />
        </div>

      </div><!-- /player-row-bottom -->

      <!-- Tracklist popup -->
      <div class="tracklist-popup" id="tracklist-popup">
        <div class="tracklist-header">
          <!-- headphones icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
          </svg>
          <span>TRACKS</span>
        </div>
        <div class="tracklist-body" id="track-list"></div>
      </div>
    </div>

    <!-- ── Loading Progress ── -->
    <div class="loading-wrap">
      <div class="loading-status-row">
        <span id="loading-text" class="loading-status-txt">INITIALIZING…</span>
        <span id="loading-percent" class="loading-pct">0%</span>
      </div>
      <div class="loading-track">
        <div class="loading-fill" id="loading-bar-fill">
          <div class="loading-shimmer"></div>
        </div>
        <div class="loading-ticks">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="loading-server-name" id="loading-server-name"></div>
    </div>

  </footer>

  <!-- ══════════════════════════════════════════
       RULES MODAL
  ══════════════════════════════════════════ -->
  <div class="rules-overlay" id="rules-modal" onclick="overlayClose(event)">
    <div class="rules-box" role="dialog" aria-modal="true">

      <div class="rules-hdr">
        <div class="rules-hdr-title">
          <!-- shield icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          <span>SERVER RULES</span>
        </div>
        <button class="rules-close" onclick="toggleRules()" aria-label="Close">
          <!-- x icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6"  y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="rules-body" id="rules-body">
        <!-- Populated by script.js -->
      </div>

    </div>
  </div>

  <audio id="audio-player" preload="auto"></audio>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
