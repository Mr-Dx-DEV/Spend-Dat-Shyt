<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
body { margin:0; background:transparent; overflow:hidden; font-family: Arial, Helvetica, sans-serif; }
#paperworkContainer { position:absolute; top:22%; right:3%; display:none; z-index:9999; width:340px; }
.card { background:rgba(8,10,16,.92); border:1px solid rgba(255,255,255,.14); border-radius:18px; box-shadow:0 0 25px rgba(0,0,0,0.75); overflow:hidden; color:#fff; }
#paperworkImage { width:100%; display:block; border-bottom:1px solid rgba(255,255,255,.12); }
.info { padding:12px 14px 14px; }
.title { font-size:14px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.9; }
.name { font-size:20px; font-weight:900; margin-top:3px; }
.meta { font-size:13px; opacity:.82; margin-top:6px; line-height:1.35; }
.notes { margin-top:9px; padding:9px; border-radius:10px; background:rgba(255,255,255,.07); font-size:12px; opacity:.9; max-height:80px; overflow:hidden; }
.fade-in { animation: fadeIn 0.4s ease forwards; }
.fade-out { animation: fadeOut 0.4s ease forwards; }
@keyframes fadeIn { from {opacity:0; transform:translateX(50px);} to {opacity:1; transform:translateX(0);} }
@keyframes fadeOut { from {opacity:1; transform:translateX(0);} to {opacity:0; transform:translateX(50px);} }
</style>
</head>
<body>
<div id="paperworkContainer">
    <div class="card">
        <img id="paperworkImage" src="">
        <div class="info">
            <div class="title">Police Paperwork</div>
            <div class="name" id="paperworkName">Unknown</div>
            <div class="meta" id="paperworkMeta"></div>
            <div class="notes" id="paperworkNotes"></div>
        </div>
    </div>
</div>
<script>
window.addEventListener('message', function(event) {
    const data = event.data;
    const container = document.getElementById('paperworkContainer');
    const img = document.getElementById('paperworkImage');
    const name = document.getElementById('paperworkName');
    const meta = document.getElementById('paperworkMeta');
    const notes = document.getElementById('paperworkNotes');

    if (data.action === 'showPaperworkImage') {
        const info = data.info || {};
        img.src = data.image;
        name.textContent = info.name || 'Your Paperwork';
        meta.innerHTML = `Status: <b>${info.statusLabel || 'Unknown'}</b><br>Date: ${info.date || 'N/A'}`;
        notes.textContent = info.notes ? info.notes : 'No extra notes listed.';

        container.style.display = 'block';
        container.classList.remove('fade-out');
        container.classList.add('fade-in');

        setTimeout(() => {
            container.classList.remove('fade-in');
            container.classList.add('fade-out');
            setTimeout(() => container.style.display='none',400);
        }, 9000);
    }
});
</script>
</body>
</html>
