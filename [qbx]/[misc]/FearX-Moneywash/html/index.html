<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FearX Moneywash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="fx-hidden">
    <div id="app" class="fx-modal-outer" data-state="closed">
        <div class="fx-modal-inner">
            <header class="fx-header">
                <div class="fx-identity">
                    <div class="fx-identity-avatar">
                        <span class="ms ms-26">local_laundry_service</span>
                    </div>
                    <div class="fx-identity-text">
                        <p class="fx-identity-name">Moneywash</p>
                        <p class="fx-identity-sub">Launder dirty money — clean cash after the timer</p>
                    </div>
                </div>
                <button id="btn-close" class="fx-btn-icon fx-btn-danger" type="button" aria-label="Close">
                    <span class="ms ms-24">close</span>
                </button>
            </header>

            <hr class="fx-divider" />

            <section class="fx-content">
                <div class="fx-section-row">
                    <div class="fx-section-title">
                        <h2 id="overview-title">Wash Preview</h2>
                        <p id="overview-sub">Type an amount below to see your payout</p>
                    </div>
                    <div class="fx-section-actions">
                        <button id="btn-cancel" class="fx-chip fx-chip-danger fx-chip-hidden" type="button">
                            <span class="ms ms-18">block</span>
                            <span id="btn-cancel-label">Cancel Wash</span>
                        </button>
                        <button id="btn-refresh" class="fx-chip" type="button">
                            <span class="ms ms-18">refresh</span>
                            <span>Refresh</span>
                        </button>
                    </div>
                </div>

                <div class="fx-summary-card" id="summary-card" data-mode="preview">
                    <div class="fx-summary-rows">
                        <div class="fx-summary-row">
                            <div class="fx-summary-key">
                                <span class="ms ms-18">payments</span>
                                <span>Dirty Amount</span>
                            </div>
                            <span class="fx-summary-val" id="row-dirty">$0</span>
                        </div>
                        <div class="fx-summary-row">
                            <div class="fx-summary-key">
                                <span class="ms ms-18">percent</span>
                                <span id="row-tax-label">Tax (25%)</span>
                            </div>
                            <span class="fx-summary-val fx-summary-val-neg" id="row-tax">-$0</span>
                        </div>
                        <div class="fx-summary-row fx-summary-row-emph">
                            <div class="fx-summary-key">
                                <span class="ms ms-18">paid</span>
                                <span>You Receive</span>
                            </div>
                            <span class="fx-summary-val fx-summary-val-pos" id="row-clean">$0</span>
                        </div>
                        <div class="fx-summary-row">
                            <div class="fx-summary-key">
                                <span class="ms ms-18">schedule</span>
                                <span id="row-time-label">Wash Time</span>
                            </div>
                            <span class="fx-summary-val" id="row-time">--:--</span>
                        </div>
                    </div>
                    <div class="fx-progress-track" id="summary-progress-track">
                        <div class="fx-progress-fill" id="progress-fill" style="width:0%"></div>
                    </div>
                </div>

                <div class="fx-section-row">
                    <div class="fx-section-title">
                        <h2>Deposit Amount</h2>
                        <p>Enter the amount of dirty money you want to wash</p>
                    </div>
                </div>

                <label class="fx-input-group">
                    <div class="fx-input-shell">
                        <span class="fx-input-prefix">$</span>
                        <input id="amount" class="fx-input" type="number" min="0" step="100" inputmode="numeric" placeholder="0" autocomplete="off" />
                        <span class="fx-input-suffix">DIRTY</span>
                    </div>
                    <span class="fx-input-hint" id="hint-bounds"></span>
                </label>

                <div id="message" class="fx-message" role="status" aria-live="polite"></div>
            </section>

            <div class="fx-action-bar">
                <button id="btn-withdraw" class="fx-cta fx-cta-secondary" type="button" disabled>
                    <span class="ms ms-20">arrow_upward</span>
                    <span>Withdraw</span>
                </button>
                <button id="btn-deposit" class="fx-cta fx-cta-primary" type="button">
                    <span class="ms ms-20">arrow_downward</span>
                    <span>Deposit</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
