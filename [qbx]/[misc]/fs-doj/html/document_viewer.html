<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOJ Document Viewer</title>
    <link rel="stylesheet" href="document_viewer.css">
</head>
<body>
    <div id="document-container" class="hidden">
        <div class="document-wrapper">
            <div class="document-header">
                <img src="img/doj.png" alt="DOJ Logo" class="doj-logo">
                <h1>Department of Justice</h1>
                <p class="document-subtitle">Official Document</p>
            </div>

            <div class="document-body">
                <div class="document-info">
                    <div class="info-row">
                        <span class="label">Document Title:</span>
                        <span class="value" id="doc-title"></span>
                    </div>
                    <div class="info-row" id="evidence-row" style="display: none;">
                        <span class="label">Evidence Number:</span>
                        <span class="value" id="evidence-number"></span>
                    </div>
                    <div class="info-row" id="case-row" style="display: none;">
                        <span class="label">Case Number:</span>
                        <span class="value" id="case-number"></span>
                    </div>
                </div>

                <div class="document-content" id="doc-content">
                    <!-- Content will be inserted here -->
                </div>

                <div class="document-footer">
                    <div class="footer-row">
                        <span class="label">Printed By:</span>
                        <span class="value" id="printed-by"></span>
                    </div>
                    <div class="footer-row">
                        <span class="label">Printed On:</span>
                        <span class="value" id="printed-at"></span>
                    </div>
                    <div class="footer-stamp">
                        <p>OFFICIAL DOCUMENT</p>
                        <p>Department of Justice</p>
                    </div>
                </div>
            </div>

            <div class="document-actions">
                <button id="close-btn" class="action-btn">Close</button>
            </div>
        </div>
    </div>

    <!-- Photo Viewer -->
    <div id="photo-container" class="hidden">
        <div class="photo-wrapper">
            <div class="photo-header">
                <img src="img/doj.png" alt="DOJ Logo" class="doj-logo-small">
                <h2>Evidence Photograph</h2>
                <button id="close-photo-btn" class="close-btn">&times;</button>
            </div>

            <div class="photo-body">
                <div class="photo-info">
                    <div class="info-item">
                        <span class="label">Evidence Number:</span>
                        <span class="value" id="photo-evidence-number"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">Description:</span>
                        <span class="value" id="photo-description"></span>
                    </div>
                    <div class="info-item" id="photo-case-row" style="display: none;">
                        <span class="label">Case Number:</span>
                        <span class="value" id="photo-case-number"></span>
                    </div>
                </div>

                <div class="photo-display" id="photo-display">
                    <img id="photo-image" src="" alt="Evidence Photo" style="display: none;">
                    <div id="photo-placeholder" class="photo-placeholder">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <p>Evidence Photograph</p>
                    </div>
                </div>

                <div class="photo-footer">
                    <div class="footer-item">
                        <span class="label">Collected By:</span>
                        <span class="value" id="photo-printed-by"></span>
                    </div>
                    <div class="footer-item">
                        <span class="label">Date:</span>
                        <span class="value" id="photo-printed-at"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="document_viewer.js"></script>
</body>
</html>
