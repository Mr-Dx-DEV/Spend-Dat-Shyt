<!DOCTYPE html>
<html>
<meta charset="UTF-8">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link href="nui://vms_cityhall/html/css/shared.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/bossmenu.css" rel="stylesheet">
    <link href="css/clothing-menu.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body id="body">
    <div class="bossmenu">
        <div>
            <div class="header">
                <p class="name"></p>
                <div class="close">
                    <i class="fas fa-close"></i>
                </div>
            </div>
            <div class="menu">
                <div class="select-clothing-gender">
                    <div>
                        <div class="header">
                            <p class="name"></p>
                            <div class="back-to-menu" data-backto="clothing">
                                <i class="fas fa-close"></i>
                            </div>
                        </div>
                        <div class="menu">
                            <div data-gender="0" data-option="selected_clothing_gender" id="btn"></div>
                            <div data-gender="1" data-option="selected_clothing_gender" id="btn"></div>
                        </div>
                    </div>
                </div>

                <div class="side-bar">
                    <div data-href="employees" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>

                    <div data-href="grades" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-people-group"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>

                    <div data-href="clothing" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-shirt"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>

                    <div data-href="safe" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-vault"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>

                    <div data-href="stash" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-warehouse"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>

                    <div data-href="announcements" class="button">
                        <div class="icon-box">
                            <i class="fa-solid fa-bullhorn"></i>
                        </div>
                        <div class="name">
                            <p class="title"></p>
                            <p class="description"></p>
                        </div>
                    </div>
                </div>

                <div class="main">
                    <div data-type="employees">
                        <div>
                            <div class="side-boxes">
                                <div class="box" data-type="count">
                                    <i class="fa-solid fa-users"></i>
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>
                                </div>

                                <div class="box" data-type="check-resumes">
                                    <i class="fa-solid fa-scroll"></i>
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>
                                    <div class="buttons">
                                        <div class="btn" id="btn" data-option="resumes">
                                            <p></p>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="box" data-type="list">
                                    <div class="text">
                                        <div class="header"></div>
                                    </div>
                                    <div class="employees-list">
                                        <table id="employees-table">
                                            <thead>
                                                <tr>
                                                    <th class="table-first" style="padding-block: 0.3em;"><span id="status"></span></th>
                                                    <th id="table-badge-element"><span id="badge"></span></th>
                                                    <th><span id="employee"></span></th>
                                                    <th><span id="grade"></span></span></th>
                                                    <th class="table-last center"><span id="option"></span></th>
                                                </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                                
                                <div class="box" data-type="manage">
                                    <div class="text">
                                        <div class="header"></div>
                                    </div>
                                    <div class="data"></div>
                                    <div class="buttons">
                                        <div class="btn" id="btn" data-option="get_closest_players">
                                            <p></p>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-user-gear"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div data-type="grades">
                        <div>
                            <div class="side-boxes">
                                <div class="box" data-type="list">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <div class="grades-list"></div>
                                    <i class="fa-solid fa-people-group"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div data-type="grades-manage">
                        <div>
                            <div class="side-boxes">
                                <div class="box" data-type="grade">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <div class="data"></div>
                                    <div class="data2"></div>
                                    <i class="fa-solid fa-people-group"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div data-type="clothing">
                        <div>
                            <div class="side-boxes">
                                <div class="box" data-type="list">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <div class="clothing-list"></div>
                                    <i class="fa-solid fa-shirt"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div data-type="clothing-manage">
                        <div>
                            <div class="side-boxes">
                                <div class="box" data-type="clothes">
                                    <div class="header"></div>
                                    <div class="title"></div>
                                    <div class="data"></div>
                                    <i class="fa-solid fa-shirt"></i>
                                </div>

                                <div class="box" data-type="settings">
                                    <div class="title"></div>
                                    <div class="data"></div>
                                    <div class="buttons">
                                        <div class="btn" id="btn" data-option="save_clothing">
                                            <p></p>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-user-gear"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div data-type="safe">
                        <div>
                            <div class="side-boxes">
                                <div class="box" data-type="balance">
                                    <i class="fa-solid fa-money-bill-wave"></i>
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>
                                    <div class="buttons">
                                        <div class="btn" id="btn" data-option="safe-manage">
                                            <p></p>
                                        </div>
                                    </div>
                                </div>

                                <div class="box" data-type="balance-chart">
                                    <i class="fa-solid fa-chart-simple"></i>
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>
                                
                                    <div class="buttons">
                                        <div class="btn" id="btn" data-option="safe-transactions">
                                            <p></p>
                                        </div>
                                    </div>

                                    <div class="chart">
                                        <canvas id="myChart" style="width:100%;max-width:900px"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div data-type="safe-manage">
                        <div>
                            <div class="side-boxes">
                                <div class="box" data-type="balance">
                                    <i class="fa-solid fa-money-bill-wave"></i>
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>
                                </div>

                                <div class="box" data-type="balance-account-name">
                                    <i class="fa-solid fa-money-bill-wave"></i>
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>
                                </div>
                                
                                <div class="box" data-type="balance-internal">
                                    <i class="fa-solid fa-hand-holding-dollar"></i>
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>
                                
                                    <label id="balance-internal-amount"></label>
                                    <input id="balance-internal-amount" onkeypress="return isNumberKey(event)" onpaste="return false"></input>
                                    
                                    <div class="buttons">
                                        <div class="btn" id="btn" data-option="withdraw">
                                            <p></p>
                                        </div>
                                        <div class="btn" id="btn" data-option="deposit">
                                            <p></p>
                                        </div>
                                    </div>

                                </div>

                                <div class="box" data-type="balance-transactions">
                                    <i class="fa-solid fa-hand-holding-dollar"></i>
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>
                                    <div class="buttons">
                                        <div class="btn" id="btn" data-option="safe-transactions"></div>
                                    </div>
                                </div>

                                <div class="box" data-type="balance-transfer">
                                    <i class="fa-solid fa-shuffle"></i>
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>

                                    <div class="data">
                                        <label id="balance-transfer-account"></label>
                                        <input id="balance-transfer-account" maxlength="35">
    
                                        <label id="balance-transfer-title"></label>
                                        <input id="balance-transfer-title" maxlength="100">
    
                                        <label id="balance-transfer-amount"></label>
                                        <input id="balance-transfer-amount" onkeypress="return isNumberKey(event)" onpaste="return false"></input>
                                    </div>

                                    <div class="buttons">
                                        <div class="btn" id="btn" data-option="transfer">
                                            <p></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div data-type="safe-transactions">
                        <div>
                            <div class="text">
                                <div class="header"></div>
                                <div class="title"></div>
                            </div>

                            <div class="transactions-block">
                                <table id="transactions-table">
                                    <thead>
                                        <tr>
                                            <th id="id"></th>
                                            <th id="executor"></th>
                                            <th id="type"></th>
                                            <th id="amount"></th>
                                            <th id="title"></th>
                                            <th id="date"></th>
                                        </tr>
                                    </thead>
                                    <tbody id="transactions-list"></tbody>
                                </table>    

                                <div id="pagination">
                                    <button id="prev-page"><i class="fa-solid fa-chevron-left"></i></button>
                                    <span id="page-info"></span>
                                    <button id="next-page"><i class="fa-solid fa-chevron-right"></i></button>
                                </div>
                            </div>

                            <i class="fa-solid fa-shuffle"></i>
                        </div>
                    </div>

                    <div data-type="announcements">
                        <div>
                            <div class="side-boxes">
                                <div class="box" data-type="announcements">
                                    <div class="text">
                                        <div class="header"></div>
                                        <div class="title"></div>
                                    </div>
                                    <div class="announcements-messages" id="announcements-chat"></div>
                                    <i class="fa-solid fa-bullhorn"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="dressing-room">
        <div>
            <div class="header">
                <p class="name"></p>
                <div class="my-clothes"></div>
                <div class="close">
                    <i class="fas fa-close"></i>
                </div>
            </div>
            <div class="menu">
                <div></div>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>

    <script src="../config/config.js" type="text/javascript"></script>
    <script src="js/script.js" type="text/javascript"></script>
    <script src="js/loads.js" type="text/javascript"></script>
    <script src="nui://vms_cityhall/html/js/shared.js" type="text/javascript"></script>
</body>

</html>
