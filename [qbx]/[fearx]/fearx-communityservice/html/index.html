<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Community Service Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-transparent font-display text-gray-200 antialiased">
  <div id="player-hud" style="display:none">
    <div class="fixed top-1/2 left-4 transform -translate-y-1/2 bg-black/80 rounded-lg p-4 border border-gray-700 min-w-[300px]">
      <h2 id="hud-title" class="text-xl font-bold text-white mb-3">Community Service</h2>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between"><span id="lbl-hud-admin" class="text-gray-400">Admin:</span> <span id="hud-admin" class="text-white font-medium">N/A</span></div>
        <div class="flex justify-between"><span id="lbl-hud-tasks" class="text-gray-400">Tasks:</span> <span id="hud-tasks" class="text-white font-medium">0</span></div>
        <div class="flex justify-between"><span id="lbl-hud-reason" class="text-gray-400">Reason:</span> <span id="hud-reason" class="text-white font-medium">N/A</span></div>
      </div>
    </div>
  </div>

  <div id="admin-panel" style="display:none">
    <div class="flex items-center justify-center min-h-screen p-4 sm:p-6 lg:p-8">
      <div class="w-full max-w-7xl bg-[#030303] shadow-2xl rounded-lg overflow-hidden border border-gray-800 load-in flex flex-col h-[860px]">
        <header class="p-4 sm:p-6 flex justify-between items-center bg-[#050505] border-b border-gray-800">
          <div class="flex items-center gap-4">
            <h1 id="panel-title" class="text-xl sm:text-2xl font-bold text-white">Community Service</h1>
            <span class="text-xs font-medium text-gray-400 bg-gray-900/50 px-2 py-1 rounded-md">v1.0.0</span>
          </div>
          <button id="close-button" class="p-2 rounded-md text-gray-400 hover:bg-gray-800 transition-colors btn-press">
            <span class="material-icons-outlined text-2xl">close</span>
          </button>
        </header>

        <main class="p-4 sm:p-6 flex-1 overflow-y-auto">
          <nav class="mb-6">
            <div class="flex items-center gap-2 p-1 bg-[#111111] rounded-md max-w-max">
              <button class="tab-button px-4 py-1.5 text-sm font-semibold rounded bg-gray-200 text-gray-900 shadow-sm" data-tab="members" data-locale="tab_members">Members</button>
              <button class="tab-button px-4 py-1.5 text-sm font-medium rounded text-gray-400 hover:bg-gray-800 transition-colors" data-tab="admin-log" data-locale="tab_admin_log">Admin Log</button>
            </div>
          </nav>

          <div id="members-content" class="tab-content active">
            <div class="mb-6">
              <h2 id="members-heading" class="text-2xl font-bold text-white">Members</h2>
              <p id="members-desc" class="text-sm text-gray-400 mt-1">View and manage all members assigned to community service.</p>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
              <div class="w-full sm:w-auto flex items-center gap-2">
                <div class="relative w-full sm:w-64">
                  <span class="material-icons-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-xl">search</span>
                  <input id="search-input" class="w-full pl-10 pr-4 py-2 text-sm border border-gray-800 bg-[#111111] rounded-md focus:ring-2 focus:ring-white focus:border-white text-gray-100 placeholder-gray-500 transition-all" data-locale-ph="search_placeholder" placeholder="Search by name or ID..." type="text" />
                </div>
              </div>
              <div class="w-full sm:w-auto flex items-center gap-2">
                <button id="refresh-button" class="w-1/2 sm:w-auto flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium border border-gray-800 bg-[#111111] rounded-md hover:bg-gray-800 text-gray-300 transition-colors btn-press">
                  <span id="refresh-icon" class="material-icons-outlined text-xl transition-transform duration-500">refresh</span>
                  <span id="refresh-text" data-locale="btn_refresh">Refresh</span>
                </button>
                <button id="punish-player-button" class="w-1/2 sm:w-auto flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium border border-transparent bg-gray-200 text-gray-900 rounded-md hover:opacity-90 transition-opacity btn-press">
                  <span class="material-icons-outlined text-xl">gavel</span>
                  <span data-locale="btn_punish">Punish Player</span>
                </button>
              </div>
            </div>

            <div class="overflow-x-auto rounded-lg border border-gray-800">
              <table class="w-full min-w-[800px] text-sm text-left">
                <thead class="bg-transparent text-xs text-gray-400 uppercase">
                  <tr>
                    <th class="px-6 py-3 font-medium" scope="col" data-locale="th_member">Member</th>
                    <th class="px-6 py-3 font-medium" scope="col" data-locale="th_id">ID</th>
                    <th class="px-6 py-3 font-medium" scope="col" data-locale="th_reason">Reason</th>
                    <th class="px-6 py-3 font-medium text-center" scope="col" data-locale="th_tasks">Tasks</th>
                    <th class="px-6 py-3 font-medium" scope="col"></th>
                  </tr>
                </thead>
                <tbody id="members-table-body" class="divide-y divide-gray-800">
                </tbody>
              </table>
            </div>
          </div>

          <div id="admin-log-content" class="tab-content">
            <div class="mb-6">
              <h2 id="log-heading" class="text-2xl font-bold text-white">Admin Log</h2>
              <p id="log-desc" class="text-sm text-gray-400 mt-1">A log of all administrative actions taken in this panel.</p>
            </div>
            <div>
              <div id="admin-log-list" class="admin-log-list pr-2 space-y-3"></div>
              <div id="log-pagination" class="flex items-center justify-between mt-6 pt-4 border-t border-gray-800">
                <button id="prev-page" class="flex items-center gap-2 px-4 py-2 text-sm font-medium border border-gray-800 bg-[#111111] rounded-md hover:bg-gray-800 text-gray-300 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                  <span class="material-icons-outlined text-lg">chevron_left</span>
                  <span data-locale="btn_previous">Previous</span>
                </button>
                <span id="page-info" class="text-sm text-gray-400" data-locale="page_info">Page 1 of 1</span>
                <button id="next-page" class="flex items-center gap-2 px-4 py-2 text-sm font-medium border border-gray-800 bg-[#111111] rounded-md hover:bg-gray-800 text-gray-300 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                  <span data-locale="btn_next">Next</span>
                  <span class="material-icons-outlined text-lg">chevron_right</span>
                </button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div id="punish-modal-overlay" class="fixed inset-0 flex items-center justify-center p-4 z-50 pointer-events-none" style="display:none; opacity:0; background:transparent;">
    <div id="punish-modal-content" class="w-full max-w-2xl bg-[#030303] border border-gray-800 rounded-lg shadow-2xl transform scale-95 pointer-events-auto">
      <header class="p-4 sm:p-5 flex justify-between items-center">
        <h2 id="modal-heading" class="text-lg font-bold text-white">Punish Player</h2>
        <button id="modal-close-button" class="p-2 rounded-md text-gray-400 hover:bg-gray-800 transition-colors btn-press">
          <span class="material-icons-outlined text-2xl">close</span>
        </button>
      </header>

      <div class="p-4 sm:p-5">
        <div class="space-y-5">
          <div>
            <label for="player-id-input" class="block text-sm font-medium text-gray-300 mb-1.5" data-locale="lbl_player">Player Name or ID</label>
            <input type="text" id="player-id-input" class="w-full pl-4 pr-4 py-2 text-sm border border-gray-800 bg-[#111111] rounded-md focus:ring-2 focus:ring-white focus:border-white text-gray-100 placeholder-gray-500 transition-all" data-locale-ph="ph_player" placeholder="Enter player name or ID..." />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5" data-locale="lbl_location">Select Location</label>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            </div>
          </div>

          <div>
            <label for="task-amount-input" class="block text-sm font-medium text-gray-300 mb-1.5" data-locale="lbl_tasks">Number of Tasks</label>
            <input type="number" id="task-amount-input" class="w-full pl-4 pr-4 py-2 text-sm border border-gray-800 bg-[#111111] rounded-md focus:ring-2 focus:ring-white focus:border-white text-gray-100 placeholder-gray-500 transition-all" data-locale-ph="ph_tasks" placeholder="e.g., 10" min="1" />
          </div>

          <div>
            <label for="reason-input" class="block text-sm font-medium text-gray-300 mb-1.5" data-locale="lbl_reason">Reason for Punishment</label>
            <input type="text" id="reason-input" class="w-full pl-4 pr-4 py-2 text-sm border border-gray-800 bg-[#111111] rounded-md focus:ring-2 focus:ring-white focus:border-white text-gray-100 placeholder-gray-500 transition-all" data-locale-ph="ph_reason" placeholder="e.g., Vandalism, Reckless Driving..." />
          </div>
        </div>
      </div>

      <footer class="p-4 sm:p-5 flex justify-end gap-3 bg-[#030303] pt-5 border-t border-gray-800">
        <button id="modal-cancel-button" class="px-4 py-2 text-sm font-medium border border-gray-800 bg-[#111111] rounded-md hover:bg-gray-800 text-gray-300 transition-all duration-150 ease-in-out hover:-translate-y-0.5 active:scale-95" data-locale="btn_cancel">
          Cancel
        </button>
        <button id="modal-submit-button" class="px-4 py-2 text-sm font-medium border border-transparent bg-gray-200 text-gray-900 rounded-md hover:opacity-90 transition-all duration-150 ease-in-out hover:-translate-y-0.5 active:scale-95" data-locale="btn_submit">
          Submit Punishment
        </button>
      </footer>
    </div>
  </div>

  <div id="player-details-overlay" class="fixed inset-0 flex items-center justify-center p-4 z-50 pointer-events-none" style="display:none; opacity:0; background:rgba(0,0,0,0.7);">
    <div id="player-details-content" class="w-full max-w-lg bg-[#030303] border border-gray-800 rounded-lg shadow-2xl transform scale-95 pointer-events-auto">
    </div>
  </div>

  <div id="floating-menu-container" class="floating-menu-container"></div>

  <script src="script.js"></script>
</body>
</html>
