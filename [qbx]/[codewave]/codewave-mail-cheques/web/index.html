<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mail Heist Contract HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="contract-container" class="hidden">
        <div class="contract-header">
            <div class="contract-icon">📬</div>
            <div class="contract-title">Mail Heist Contract</div>
            <div id="contract-check" class="contract-check">&#10003;</div>
        </div>
        <div class="contract-body">
            <div id="contract-status">You're on a contract run.</div>
            <div id="contract-progress">0 / 0 mailboxes hit.</div>
            <div id="contract-timer">Time left: --:--</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
