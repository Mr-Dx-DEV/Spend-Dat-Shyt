# ============================================
#  DATABASE
# ============================================
set mysql_connection_string "mysql://root@localhost/spenddatshyt?charset=utf8mb4"
set mysql_slow_query_warning 200

# ============================================
#  SECURITY
# ============================================
set sv_scriptHookAllowed 0
set sv_authMaxVariance 1
set sv_authMinTrust 5
set sv_filterRequestControl 2
set sv_filterRequestControlSettleTimer 30000
set sv_timeout 300000
set sv_kickClientOnSlowNetwork 0

# ============================================
#  PERFORMANCE & POOLS
# ============================================
set sv_threadedClientHandler "true"
set onesync_enabled 1
set onesync_distanceCull 250.0

# ============================================
# HIGH Pool Sizes (Recommended Starting Point)
# ============================================

# ============================================
# Pool Size Increases - Fix for Pool Crashes
# ============================================

increase_pool_size "Building" 20000
increase_pool_size "StaticBounds" 5000
increase_pool_size "CMoveObject" 500
increase_pool_size "FragmentStore" 14000
increase_pool_size "OcclusionInteriorInfo" 20
increase_pool_size "OcclusionPathNode" 5000
increase_pool_size "OcclusionPortalEntity" 750
increase_pool_size "OcclusionPortalInfo" 750
increase_pool_size "PortalInst" 225
increase_pool_size "ScaleformStore" 200
increase_pool_size "TxdStore" 26000
increase_pool_size "AnimStore" 20480

# OneSync Entity Pool Limits
set sv_entityPoolSize 4096
set sv_objectPoolSize 4096
set sv_pedPoolSize 512
set sv_vehiclePoolSize 512
set sv_pickupPoolSize 2048

# ============================================
#  VOICE & OX
# ============================================
exec permissions.cfg
exec misc.cfg

exec voice.cfg
exec ox.cfg

# ============================================
#  QBOX SETTINGS
# ============================================
setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "discord.gg/YourDiscord"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "true"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "true"
setr qbx:enableGroupManagement "false"

setr illenium-appearance:locale "en"


# ============================================
#  RESOURCES
# ============================================
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
stop basic-gamemode
ensure hardcap
ensure baseevents

