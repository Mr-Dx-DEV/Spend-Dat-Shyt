endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 48                    # Lowered for testing - raise back to 64 once stable
sv_licenseKey "cfxk_msgfRTs5thwy3xRGvJE9_3b4sTS"

set sv_usePrimaryIdentifier 'license'
sv_hostname "Spend Dat Shyt"
sets sv_projectName "Spend Dat Shyt"
sets sv_projectDesc "Semi-Serious Roleplay"
sets locale "en-US"

load_server_icon myLogo.png
set sv_enforceGameBuild 3258

# ============================================
#  DATABASE
# ============================================
set mysql_connection_string "mysql://root@localhost/Qbox_E24256?charset=utf8mb4"

# ============================================
#  PERFORMANCE & POOLS (Moderate/Balanced)
# ============================================
set sv_threadedClientHandler "true"
set onesync_enabled 1
set onesync_distanceCull 250.0

# Moderate pool sizes - should reduce hangs without hitting pool limits too quickly
increase_pool_size "Building" 20000
increase_pool_size "StaticBounds" 4000
increase_pool_size "CMoveObject" 500
increase_pool_size "FragmentStore" 8000
increase_pool_size "OcclusionPathNode" 4000
increase_pool_size "TxdStore" 15000
increase_pool_size "AnimStore" 12000

set sv_entityPoolSize 4096
set sv_objectPoolSize 4096
set sv_pedPoolSize 512
set sv_vehiclePoolSize 512
set sv_pickupPoolSize 2048

# ============================================
#  VOICE & OX
# ============================================
exec voice.cfg
exec ox.cfg

# ============================================
#  QBOX SETTINGS
# ============================================
