add_ace resource.rcore_prison command.remove_ace allow
add_ace resource.rcore_prison command.add_principal allow
add_ace resource.rcore_prison command.remove_principal allow

# rcore_clothing permissions
add_ace resource.rcore_clothing command.add_ace allow
add_ace resource.rcore_clothing command.add_principal allow
add_ace resource.rcore_clothing command.remove_principal allow

############################################
#               JD LOGS V3                 #
############################################

add_ace resource.JD_logsV3 command.add_principal allow
add_ace resource.JD_logsV3 command.remove_principal allow
add_ace resource.JD_logsV3 command.add_ace allow
add_ace resource.JD_logsV3 command.remove_ace allow

