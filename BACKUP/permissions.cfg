############################################
#              BASE PERMISSIONS            #
############################################

# Allow admins to use all commands
add_ace group.admin command allow
add_ace group.superadmin command allow

add_ace resource.addon command allow

add_ace group.admin drugscreator_admin allow

############################################
#            QBOX / QBCORE CORE            #
############################################

# Qbox core (QBX)
add_ace resource.qbx_core command allow

# QBCore core (keep for compatibility)
add_ace resource.qb-core command allow

############################################
#                 OX_LIB                   #
############################################

# ox_lib needs permissions to manage ace/principals for some features
add_ace resource.ox_lib command allow
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

############################################
#            RESOURCE PERMISSIONS          #
############################################

add_ace resource.ox_inventory command allow
add_ace resource.ox_doorlock command allow
add_ace resource.ElectronAC command allow




add_ace resource.luxu_admin command allow
set mumble_allowExternalConnections true
add_unsafe_child_process_permission luxu_admin # Must be set before any resource starts! Very important

############################################
#               ACE GROUPS                 #
############################################

# Define your staff groups
add_ace group.superadmin admin allow
add_ace group.admin admin allow
add_ace group.mod mod allow
add_ace group.support support allow

# Staff inheritance (SuperAdmin > Admin > Mod > Support)
add_principal group.superadmin group.admin
add_principal group.admin group.mod
add_principal group.mod group.support

############################################
#            QBCORE PERMISSION TREE        #
############################################

add_ace qbcore.god command allow
add_principal qbcore.god group.admin
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod

############################################
#             RESOURCE EXCEPTIONS          #
############################################

# zdiscord (bot / staff chat) - uncomment if you add zdiscord
# add_ace resource.zdiscord command allow
# add_ace group.zdiscordstaff zdiscord.staffchat allow
# add_ace group.mod zdiscord.staffchat allow
# add_ace group.admin zdiscord.staffchat allow
# add_ace group.superadmin zdiscord.staffchat allow

# Contracts admin
add_ace group.admin contracts_admin allow

# Sea Dome access
add_ace group.admin sea_dome.access allow

# Paintball
add_ace group.admin paintball.admin allow

# Ammo shop
add_ace group.admin ammunation.opencreator allow

# Zone creator
add_ace group.admin command.createzone allow

############################################
#        ANTICHEAT - ElectronAC            #
############################################

add_unsafe_child_process_permission ElectronAC

#### FiveGuard / Spider - uncomment if you add these resources
